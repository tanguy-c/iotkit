[package]
name         = "sleepy"
description  = "A deep-sleeping sensor on the ESP32-C6-DevKitC-1: wakes up every minute, reports, sleeps"
publish      = false
edition.workspace      = true
rust-version.workspace = true
version      = "0.1.0"
license.workspace      = true

[features]
default = ["esp32c6"]
esp32c6 = ["iotkit/esp32c6", "esp-hal/esp32c6", "esp-rtos/esp32c6"]

[dependencies]
iotkit = { workspace = true, features = ["deep-sleep", "ha-update"] }

esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
embassy-executor       = { workspace = true }
embassy-futures        = "0.1"
embassy-time           = { workspace = true }
log                    = { workspace = true }

[build-dependencies]
iotkit-build = { workspace = true }
