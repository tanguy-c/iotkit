[package]
name         = "thread-light"
description  = "Matter over Thread on the ESP32-C6-DevKitC-1: the RGB LED as a light, updated over Matter (the `cargo iotkit new` output for xtask/answers/thread.toml)"
publish      = false
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[features]
## The chip: one with an 802.15.4 radio (the ESP32-C6 by default).
default = ["esp32c6"]
esp32c6 = ["esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-hal-smartled/esp32c6", "esp-radio/esp32c6", "iotkit/esp32c6"]
esp32h2 = ["esp-hal/esp32h2", "esp-rtos/esp32h2", "esp-hal-smartled/esp32h2", "esp-radio/esp32h2", "iotkit/esp32h2"]

[dependencies]
# A path, not `workspace = true`: older cargo cannot turn the default features off over it.
iotkit = { path = "../../crates/iotkit", default-features = false, features = ["matter-thread", "matter-ota", "smartled", "remember"] }

esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
esp-radio              = { version = "1.0.0-beta.1", features = ["ble", "ieee802154", "esp-alloc", "log-04", "unstable"] }
esp-hal-smartled       = { workspace = true }
embassy-executor       = { workspace = true }
embassy-futures        = "0.1"
embassy-time           = { workspace = true }
smart-leds             = { workspace = true }
log                    = { workspace = true }

[build-dependencies]
iotkit-build = { workspace = true }
