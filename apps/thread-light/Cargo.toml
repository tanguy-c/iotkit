[package]
name         = "thread-light"
description  = "Matter over Thread on the ESP32-C6-DevKitC-1: the RGB LED as a colour light and the chip temperature"
publish      = false
version      = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true

[features]
## The chip: one with an 802.15.4 radio (the ESP32-C6 by default).
default = ["esp32c6"]
esp32c6 = ["esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-alloc/esp32c6", "esp-bootloader-esp-idf/esp32c6", "esp-hal-smartled/esp32c6", "esp-radio/esp32c6", "esp-println/esp32c6", "iotkit-config/esp32c6", "iotkit-diag/esp32c6", "iotkit-link-matter/esp32c6"]
esp32h2 = ["esp-hal/esp32h2", "esp-rtos/esp32h2", "esp-alloc/esp32h2", "esp-bootloader-esp-idf/esp32h2", "esp-hal-smartled/esp32h2", "esp-radio/esp32h2", "esp-println/esp32h2", "iotkit-config/esp32h2", "iotkit-diag/esp32h2", "iotkit-link-matter/esp32h2"]

[dependencies]
iotkit-config      = { workspace = true }
iotkit-diag        = { workspace = true, features = ["panic-handler"] }
iotkit-link-matter = { workspace = true, features = ["thread"] }
iotkit-model       = { workspace = true }
iotkit-net         = { workspace = true }

esp-alloc              = { workspace = true }
esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
esp-radio              = { version = "1.0.0-beta.1", features = ["ble", "ieee802154", "esp-alloc", "log-04", "unstable"] }
esp-bootloader-esp-idf = { workspace = true }
esp-println            = { workspace = true }
esp-hal-smartled       = { workspace = true }
embassy-executor       = { workspace = true }
embassy-futures        = "0.1"
embassy-sync           = { workspace = true }
embassy-time           = { workspace = true }
smart-leds             = { workspace = true }
static_cell            = { workspace = true }
log                    = { workspace = true }
heapless               = { workspace = true }

[build-dependencies]
iotkit-build = { workspace = true }
