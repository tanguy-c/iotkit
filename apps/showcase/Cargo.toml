[package]
name         = "showcase"
description  = "One entity of each kind, simulated: to try them in Home Assistant over MQTT and Matter"
publish      = false
edition.workspace      = true
rust-version.workspace = true
version      = "0.1.3"
license.workspace      = true

[features]
default = ["esp32c6"]
esp32c6 = ["iotkit/esp32c6", "esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-hal-smartled/esp32c6"]
## Matter over Wi-Fi, next to MQTT.
matter-wifi = ["iotkit/matter-wifi"]

[dependencies]
iotkit = { workspace = true, features = ["ha-update", "smartled"] }

esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
esp-hal-smartled       = { workspace = true }
smart-leds             = { workspace = true }
embassy-executor       = { workspace = true }
embassy-futures        = "0.1"
embassy-time           = { workspace = true }
log                    = { workspace = true }

[build-dependencies]
iotkit-build = { workspace = true }
