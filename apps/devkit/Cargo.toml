[package]
name         = "devkit"
description  = "Reference firmware for the ESP32-C6-DevKitC-1"
publish      = false
# The firmware version: bump it for each update (`cargo xtask ota push` refuses downgrades).
edition.workspace      = true
rust-version.workspace = true
version      = "0.8.7"
license.workspace      = true

[features]
## Matter over Wi-Fi, next to MQTT.
matter-wifi = ["iotkit-app/matter-wifi"]

[dependencies]
iotkit-app = { workspace = true, features = ["esp32c6"] }

esp-alloc              = { workspace = true }
esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
esp-bootloader-esp-idf = { workspace = true }
esp-hal-smartled       = { workspace = true }
embassy-executor       = { workspace = true }
embassy-futures        = "0.1"
embassy-time           = { workspace = true }
smart-leds             = { workspace = true }
log                    = { workspace = true }
serde                  = { version = "1", default-features = false, features = ["derive"] }

[build-dependencies]
iotkit-build = { workspace = true }
