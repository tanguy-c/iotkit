[package]
name         = "devkit"
description  = "Reference firmware for the ESP32-C6-DevKitC-1"
publish      = false
# The firmware version: bump it for each update (`cargo xtask ota push` refuses downgrades).
edition.workspace      = true
rust-version.workspace = true
version      = "0.8.9"
license.workspace      = true

[features]
## The chip: one of them (the ESP32-C6 by default; `--no-default-features --features esp32c3`).
default = ["esp32c6"]
esp32c6 = ["esp-hal/esp32c6", "esp-rtos/esp32c6", "esp-hal-smartled/esp32c6", "iotkit/esp32c6", "iotkit/improv-ble"]
esp32c3 = ["esp-hal/esp32c3", "esp-rtos/esp32c3", "esp-hal-smartled/esp32c3", "iotkit/esp32c3", "iotkit/improv-ble"]
esp32c5 = ["esp-hal/esp32c5", "esp-rtos/esp32c5", "esp-hal-smartled/esp32c5", "iotkit/esp32c5", "iotkit/improv-ble"]
esp32s3 = ["esp-hal/esp32s3", "esp-rtos/esp32s3", "esp-hal-smartled/esp32s3", "iotkit/esp32s3", "iotkit/improv-ble"]
esp32   = ["esp-hal/esp32", "esp-rtos/esp32", "esp-hal-smartled/esp32", "iotkit/esp32"]
## Matter over Wi-Fi, next to MQTT.
matter-wifi = ["iotkit/matter-wifi"]
## TLS for MQTT (port 8883) and https:// updates; IOTKIT_TLS_CA names the CA (DER).
tls = ["iotkit/tls"]

[dependencies]
# A path, not `workspace = true`: older cargo cannot turn the default features off over it.
# Bluetooth setup on every chip but the ESP32 (see the chip features).
iotkit = { path = "../../crates/iotkit", default-features = false, features = ["wifi", "softap", "improv-serial", "console", "ota-push"] }

esp-hal                = { workspace = true }
esp-rtos               = { workspace = true }
esp-hal-smartled       = { workspace = true }
embassy-executor       = { workspace = true }
embassy-futures        = "0.1"
embassy-time           = { workspace = true }
smart-leds             = { workspace = true }
log                    = { workspace = true }
serde                  = { version = "1", default-features = false, features = ["derive"] }

[build-dependencies]
iotkit-build = { workspace = true }
