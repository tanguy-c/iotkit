[template]
cargo_generate_version = ">=0.22.0"
# Kept in sync with the repository root by CI; see template/README.md.
exclude = []
ignore  = ["README.md", "check-sync.sh"]

[placeholders.chip]
type    = "string"
prompt  = "Chip? (only the ESP32-C6 is tested on hardware; Matter is C6-only)"
choices = ["esp32c6", "esp32c3", "esp32c5", "esp32s3"]
default = "esp32c6"

[placeholders.iotkit_path]
type    = "string"
prompt  = "Absolute path of your iotkit checkout (the folder with crates/ and xtask/)?"
