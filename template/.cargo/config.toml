# Wi-Fi credentials for the firmware: `secrets.toml` (git-ignored, see `secrets.toml.example`).
include = [{ path = "secrets.toml", optional = true }]

# Run cargo from the project root: the runner's partition table path is relative to it.
# `--erase-parts otadata` makes every USB flash boot `ota_0`, even after an OTA switched slots.
[target.{% if chip == "esp32s3" %}xtensa-esp32s3-none-elf{% elsif chip == "esp32" %}xtensa-esp32-none-elf{% elsif chip == "esp32c3" %}riscv32imc-unknown-none-elf{% else %}riscv32imac-unknown-none-elf{% endif %}]
runner    = "espflash flash --monitor --chip {{chip}} --flash-size {% if chip == "esp32c3" or chip == "esp32" %}4mb{% else %}8mb{% endif %} --partition-table {% if chip == "esp32c3" or chip == "esp32" %}partitions-4mb.csv{% else %}partitions.csv{% endif %} --erase-parts otadata"
{% if chip == "esp32s3" or chip == "esp32" %}rustflags = ["-C", "link-arg=-nostartfiles", "-C", "link-arg=-Wl,--no-warn-rwx-segments"]

# The Xtensa chips build `core` and `alloc` themselves (the `esp` toolchain, `espup install`).
[unstable]
build-std = ["core", "alloc"]
{% else %}# Backtraces (esp-backtrace) need frame pointers.
rustflags = ["-C", "force-frame-pointers"]
{% endif %}
[build]
target = "{% if chip == "esp32s3" %}xtensa-esp32s3-none-elf{% elsif chip == "esp32" %}xtensa-esp32-none-elf{% elsif chip == "esp32c3" %}riscv32imc-unknown-none-elf{% else %}riscv32imac-unknown-none-elf{% endif %}"

[env]
# Log level, read at build time by esp-println.
ESP_LOG = "info"
# Names (1 to 10 of [a-z0-9-]; 1 to 16 characters): `<IOTKIT_HOSTNAME>-xxxx.local`, the setup
# access point and the device in Home Assistant; MQTT topics `<IOTKIT_TOPIC_PREFIX>/<host>/...`.
# IOTKIT_HOSTNAME     = "iotkit"
# IOTKIT_TOPIC_PREFIX = "iotkit"
