# Development broker: no authentication, no persistence.
listener 1883
allow_anonymous true
persistence false
log_dest stdout

# TLS 1.3 on 8883, with the certificates of certs/make.sh (run it first).
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.3
