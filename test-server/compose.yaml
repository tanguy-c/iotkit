# Dev and CI services: `docker compose -f test-server/compose.yaml up` (or podman compose).
#   MQTT broker     mqtt://<this PC>:1883   (anonymous, for development only)
#   Updates         http://<this PC>:8080/<package>/manifest.json   (serves ../dist from `cargo xtask build`)
#   Home Assistant  http://localhost:8123   (`up -d homeassistant`; about 1.7 GB; its broker is localhost:1883;
#                   host network, as on a real install: mDNS, `.local` names and ESPHome discovery)
#   Matter server   ws://localhost:5580/ws, dashboard http://localhost:5580  (`up -d matter-server`; host network: Matter needs IPv6
#                   multicast; in the Home Assistant container's Matter integration the URL is
#                   ws://host.containers.internal:5580/ws with rootless podman); commissioning over
#                   Bluetooth from this PC: add `-f compose.bluetooth.yaml`
services:
  mosquitto:
    image: docker.io/library/eclipse-mosquitto:2
    ports: ["1883:1883", "8883:8883"]
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
      - ./certs:/mosquitto/certs:ro,z   # shared label: two containers read it

  updates:
    image: docker.io/library/caddy:2
    command: caddy run --config /etc/caddy/Caddyfile
    ports: ["8080:8080", "8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - ./certs:/certs:ro,z
      # What `cargo iotkit ota publish --to published` puts there: devices check its manifests.
      - ../published:/srv:ro,Z

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    # mDNS needs the host's network: a bridged container cannot resolve `iotkit-xxxx.local` or
    # discover ESPHome devices.
    network_mode: host
    volumes:
      - ./ha-config:/config:Z
    depends_on: [mosquitto]

  matter-server:
    # matter.js's server, as in Home Assistant's Matter Server add-on (9.0 and later). Its state is
    # not python-matter-server's: empty `matter-data/` when coming from it.
    image: ghcr.io/matter-js/matterjs-server:stable
    network_mode: host
    # The image runs as uid 1000, which may not own the folders below (Docker creates them as
    # root; rootless Podman maps uid 1000 elsewhere). Root writes to them in both.
    user: "0:0"
    environment:
      STORAGE_PATH: /data
      # The device may only have an IPv6 link-local address: name the interface towards it
      # (`MATTER_INTERFACE=wlp2s0 docker compose ... up -d matter-server`; `ip link` lists them).
      PRIMARY_INTERFACE: ${MATTER_INTERFACE:-wlan0}
      # The test vendor's certificates (iotkit's devices), and the `.ota` files of `/updates`:
      # each one copied there (`cargo iotkit ota build` writes them in `dist/<package>/`) is
      # imported when the server starts, then deleted.
      ENABLE_TEST_NET_DCL: "true"
      OTA_PROVIDER_DIR: /updates
    volumes:
      - ./matter-data:/data:Z
      - ./matter-ota:/updates:Z
