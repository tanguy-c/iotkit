# `cargo iotkit new --answers answers/h2.toml`: Matter over Thread on the ESP32-H2-DevKitM-1 (4 MB,
# 320 KB of RAM), a relay; updates of the daily checks install at 03:00 in the controller's time.
# CI generates and builds it.
name        = "H2 light"
maker       = "CI"
board       = "esp32h2-devkitm-1"
transport   = "thread"
matter      = "per-device"
update_time = "03:00"

[[parts]]
kind = "relay"
name = "Relay"
pin  = 2
