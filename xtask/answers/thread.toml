# `cargo iotkit new --answers answers/thread.toml`: Matter over Thread on the ESP32-C6-DevKitC-1,
# its RGB LED as a light; each device draws its pairing code. `apps/thread-light` is generated
# from it. CI generates and builds it.
name    = "iotkit thread light"
package = "thread-light"
maker   = "iotkit"
board   = "esp32c6-devkitc-1"
transport = "thread"
matter    = "per-device"
