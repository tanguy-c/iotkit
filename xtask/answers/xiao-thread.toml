# `cargo iotkit new --answers answers/xiao-thread.toml`: a XIAO ESP32-C6 (4 MB) over Matter and
# Thread, a plug; paired through a Thread border router. CI generates and builds it.
name      = "Xiao plug"
maker     = "CI"
board     = "xiao-esp32c6"
transport = "thread"
matter    = "fixed"

[[parts]]
kind = "relay"
name = "Plug"
pin  = 2
