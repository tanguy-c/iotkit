# A plugged-in original ESP32 (DevKitC, WROOM-32) with a relay, a door contact, a button and a
# soil probe. CI builds it in the Xtensa job.
name  = "Shed controller"
maker = "CI"
board = "esp32-devkitc"
power = "plugged"

[[parts]]
kind = "relay"
pin  = 4

[[parts]]
kind = "contact"
name = "Door"
pin  = 13

[[parts]]
kind = "button"
pin  = 14

[[parts]]
kind = "soil_moisture"
pin  = 34
