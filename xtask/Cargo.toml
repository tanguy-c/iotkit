# Host tooling: `cargo xtask <command>` in this repository, `cargo iotkit <command>` once
# installed (`cargo install --path xtask`). Its own workspace: the firmware workspace builds for
# the chip by default.
[workspace]

[package]
name         = "iotkit-cli"
description  = "cargo iotkit: new projects, signed builds, flashing and OTA for iotkit firmware"
publish      = false
edition      = "2024"
rust-version = "1.95"
version      = "0.5.1"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tanguy-c/iotkit"

[[bin]]
name = "cargo-iotkit"
path = "src/main.rs"

[dependencies]
iotkit-core     = { path = "../crates/iotkit-core", features = ["sign"] }
ed25519-compact = { version = "2.6", default-features = false, features = ["random"] }
anyhow          = "1"
clap            = { version = "4.6", features = ["derive"] }
serde_json      = "1"
inquire         = { version = "0.9", default-features = false, features = ["crossterm"] }
liquid          = "0.26"
toml            = { version = "0.9", default-features = false, features = ["display", "parse", "serde"] }
getrandom       = { version = "0.4", default-features = false }
qrcode          = { version = "0.14", default-features = false, features = ["svg"] }
serde           = { version = "1", features = ["derive"] }
