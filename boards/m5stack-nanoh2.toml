# Also a blue LED and an IR LED, left to the app.
label    = "M5Stack NanoH2 (ESP32-H2, 4 MB; Thread only: Matter over Thread; tiny, cased)"
chip     = "esp32h2"
model    = "M5Stack NanoH2"
flash    = "4mb"
boot_pin = 9
order    = 102
led      = { kind = "rgb", pin = 11 }
sources  = [
    "https://docs.m5stack.com/en/core/NanoH2",
    "https://docs.m5stack.com/en/arduino/m5nanoh2/program",
]

[[init]]
pin   = 10
level = "high"
why   = "powers the RGB LED"
