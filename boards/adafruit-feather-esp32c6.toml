# Its NeoPixel shares GPIO9 with BOOT, the setup button: the red LED shows the status instead.
label    = "Adafruit Feather ESP32-C6 (ESP32-C6, 4 MB; battery charger; no Matter in 4 MB)"
chip     = "esp32c6"
model    = "Adafruit Feather ESP32-C6"
flash    = "4mb"
boot_pin = 9
order    = 112
led      = { kind = "plain", pin = 15, active = "high" }
sources  = [
    "https://learn.adafruit.com/adafruit-esp32-c6-feather/pinouts",
    "https://github.com/zephyrproject-rtos/zephyr/blob/main/boards/adafruit/feather_esp32c6/adafruit_feather_esp32c6_hpcore.dts",
    "https://github.com/espressif/arduino-esp32/blob/master/variants/adafruit_feather_esp32c6/pins_arduino.h",
]
