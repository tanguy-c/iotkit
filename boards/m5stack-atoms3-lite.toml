# The button on its face is the setup button (GPIO41; BOOT, GPIO0, is inside the case).
label    = "M5Stack AtomS3 Lite (ESP32-S3, 8 MB; cased, a button and an RGB LED; no Matter yet)"
chip     = "esp32s3"
model    = "M5Stack AtomS3 Lite"
flash    = "8mb"
boot_pin = 41
order    = 101
led      = { kind = "rgb", pin = 35 }
sources  = [
    "https://docs.m5stack.com/en/core/AtomS3%20Lite",
    "https://github.com/zephyrproject-rtos/zephyr/blob/main/boards/m5stack/m5stack_atoms3_lite/m5stack_atoms3_lite_procpu.dts",
    "https://devices.esphome.io/devices/m5stack-atoms3-lite/",
    "https://github.com/espressif/arduino-esp32/blob/master/variants/m5stack_atoms3/pins_arduino.h",
]
