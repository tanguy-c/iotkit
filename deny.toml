# cargo-deny: licenses, advisories, sources. Checks the firmware workspace.
[graph]
targets = ["riscv32imac-unknown-none-elf", "riscv32imc-unknown-none-elf", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, no known vulnerability; both come in through esp-hal and its build scripts.
    { id = "RUSTSEC-2024-0436", reason = "paste: macro-only, via esp-hal" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml: build-time only, via esp-config's serde_yaml" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib",
    # Permissive: smoltcp, managed, ieee802154 (0BSD); tinyrlibc (BlueOak).
    "0BSD", "BlueOak-1.0.0",
    # Weak copyleft, build time only: rs-matter's code generator (nom-supreme, brownstone, indent_write).
    "MPL-2.0",
]

# tinyrlibc 0.5.1 has no license field; its LICENCES.md lists Blue Oak, plus BSD (newlib) and MIT (relibc) files.
[[licenses.clarify]]
crate          = "tinyrlibc"
expression     = "BlueOak-1.0.0 AND BSD-3-Clause AND MIT"
license-files  = [{ path = "LICENCES.md", hash = 0x391e9384 }]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
# rs-matter-embassy has no crates.io release; pinned by rev in crates/iotkit.
allow-git        = ["https://github.com/sysgrok/rs-matter-embassy"]
