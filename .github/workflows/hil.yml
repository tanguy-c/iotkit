name: Hardware

# tools/hil/run.py on a real ESP32-C6 DevKit: flash, healthy, OTA push kept, OTA rollback.
# Needs a self-hosted runner labelled `iotkit-c6` with the board on USB (espflash, pyserial,
# Rust targets installed), on the network the secrets below name, with a broker reachable there.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  c6:
    runs-on: [self-hosted, iotkit-c6]
    timeout-minutes: 40
    env:
      WIFI_SSID: ${{ secrets.HIL_WIFI_SSID }}
      WIFI_PASS: ${{ secrets.HIL_WIFI_PASS }}
      MQTT_HOST: ${{ secrets.HIL_MQTT_HOST }}
    steps:
      - uses: actions/checkout@v4
      # A key of the run's own: the board is flashed over USB with it first.
      - run: cargo xtask keygen --force
      - run: tools/hil/run.py
