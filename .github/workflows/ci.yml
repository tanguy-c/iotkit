name: CI

# The quick checks, on every push and pull request. The other chips, the generated projects, fuzzing
# and advisories are in full.yml (nightly, on request, or with the `full-ci` label).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host crates and the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nxtask -> target"
      - run: ./template/check-sync.sh
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path xtask/Cargo.toml
      - run: cargo test-host
      - run: cargo clippy -p iotkit-core -p iotkit -p iotkit-build --target host-tuple --all-targets --no-default-features --features iotkit-core/sign,iotkit/smartled,iotkit/esphome-api -- -D warnings
      - run: cargo clippy --manifest-path xtask/Cargo.toml --target host-tuple --all-targets -- -D warnings
      - run: cargo test --manifest-path xtask/Cargo.toml --target host-tuple

  firmware:
    name: Firmware (ESP32-C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash
      # A throw-away signing key: the firmware embeds keys/ota.pub.
      - run: cargo xtask keygen
      # Per app, not `--workspace`: devkit's Wi-Fi and thread-light's 802.15.4 would unify into one
      # esp-radio build, which refuses both at once.
      - run: cargo clippy -p devkit -- -D warnings
      - run: cargo clippy -p showcase -- -D warnings
      - run: cargo clippy -p showcase --features matter-wifi -- -D warnings
      - run: cargo clippy -p sleepy -- -D warnings
      - run: cargo clippy -p lean -- -D warnings
      # The chip side of the libraries, which the host jobs do not build.
      - run: cargo clippy -p iotkit --features iotkit/esp32c6 -- -D warnings
      # Matter over Wi-Fi next to MQTT (git dependency, 8 MB partitions).
      - run: cargo clippy -p devkit --features matter-wifi -- -D warnings
      # TLS, with a throw-away CA to build in.
      - run: |
          openssl ecparam -name prime256v1 -genkey -noout -out "$RUNNER_TEMP/ca.key"
          openssl req -x509 -new -key "$RUNNER_TEMP/ca.key" -subj /CN=ci -outform der -out "$RUNNER_TEMP/ca.der"
          IOTKIT_TLS_CA="$RUNNER_TEMP/ca.der" cargo clippy -p devkit --features tls -- -D warnings
      - run: cargo clippy -p devkit --features esphome-api -- -D warnings
      # Matter over Thread builds OpenThread and mbedtls from C.
      - run: sudo apt-get update && sudo apt-get install -y clang cmake
      - run: cargo clippy -p thread-light -- -D warnings
      # Signed build, then check it like a device would.
      - run: cargo xtask build --release
      - run: cargo xtask verify dist/devkit/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: devkit
          path: dist/

  size:
    name: C6 size against the PR base
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'size-ok')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          key: size
      - run: sudo apt-get update && sudo apt-get install -y clang cmake
      - run: tools/size-check.sh ${{ github.event.pull_request.base.sha }}

  links:
    name: Unused code is not linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: links
      - run: tools/link-check.sh

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories change without a commit: full.yml checks them nightly.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # The one check to require: it passes when every job above passed or was skipped (`size` is).
  ci-ok:
    name: CI passed
    if: always()
    needs: [host, firmware, size, links, deny]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
