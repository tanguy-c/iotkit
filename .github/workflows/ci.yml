name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    name: Host crates and the CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nxtask -> target"
      - run: cargo fmt --all --check
      - run: cargo fmt --all --check --manifest-path xtask/Cargo.toml
      - run: cargo test-host --features iotkit-image/sign
      - run: cargo clippy -p iotkit-image -p iotkit-config -p iotkit-diag -p iotkit-runtime -p iotkit-net -p iotkit-ota -p iotkit-provision -p iotkit-model -p iotkit-link-mqtt -p iotkit-link-matter -p iotkit-build --target host-tuple --all-targets --features iotkit-image/sign -- -D warnings
      - run: cargo clippy --manifest-path xtask/Cargo.toml --target host-tuple --all-targets -- -D warnings
      - run: cargo test --manifest-path xtask/Cargo.toml --target host-tuple

  firmware:
    name: Firmware (ESP32-C6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash
      # A throw-away signing key: the firmware embeds keys/ota.pub.
      - run: cargo xtask keygen
      # Per app, not `--workspace`: devkit's Wi-Fi and thread-light's 802.15.4 would unify into one
      # esp-radio build, which refuses both at once.
      - run: cargo clippy -p devkit -- -D warnings
      - run: cargo clippy -p showcase -- -D warnings
      - run: cargo clippy -p showcase --features matter-wifi -- -D warnings
      - run: cargo clippy -p sleepy -- -D warnings
      # The chip side of the libraries, which the host jobs do not build.
      - run: cargo clippy -p iotkit-config -p iotkit-diag -p iotkit-net -p iotkit-ota -p iotkit-provision -p iotkit-link-mqtt -p iotkit-app --features iotkit-config/esp32c6,iotkit-diag/esp32c6,iotkit-net/esp32c6,iotkit-ota/esp32c6,iotkit-provision/esp32c6,iotkit-link-mqtt/esp32c6,iotkit-app/esp32c6 -- -D warnings
      # Matter over Wi-Fi next to MQTT (git dependency, 8 MB partitions).
      - run: cargo clippy -p devkit --features matter-wifi -- -D warnings
      # Matter over Thread builds OpenThread and mbedtls from C.
      - run: sudo apt-get update && sudo apt-get install -y clang cmake
      - run: cargo clippy -p thread-light -- -D warnings
      # Signed build, then check it like a device would.
      - run: cargo xtask build --release
      - run: cargo xtask verify dist/devkit/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: devkit
          path: dist/

  # The C6 builds must not grow (see AGENTS.md). Growth meant by the PR: add the `size-ok` label
  # and re-run.
  size:
    name: C6 size against the PR base
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'size-ok')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          key: size
      - run: sudo apt-get update && sudo apt-get install -y clang cmake
      - run: tools/size-check.sh ${{ github.event.pull_request.base.sha }}

  links:
    name: Unused code is not linked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: links
      - run: tools/link-check.sh

  # The other chips: build-tested only (the C6 job above is the one tested on hardware).
  chips-riscv:
    name: Firmware (${{ matrix.chip }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chip: esp32c3, app: devkit, target: riscv32imc-unknown-none-elf }
          - { chip: esp32c5, app: devkit, target: riscv32imac-unknown-none-elf }
          - { chip: esp32h2, app: thread-light, target: riscv32imac-unknown-none-elf }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.chip }}
      - run: cargo xtask keygen
      - if: matrix.app == 'thread-light'
        run: sudo apt-get update && sudo apt-get install -y clang cmake
      - run: cargo clippy -p ${{ matrix.app }} --no-default-features --features ${{ matrix.chip }} --target ${{ matrix.target }} -- -D warnings
      # Deep sleep (Wi-Fi chips only).
      - if: matrix.app == 'devkit'
        run: cargo clippy -p iotkit-app --features iotkit-app/${{ matrix.chip }},iotkit-app/deep-sleep --target ${{ matrix.target }} -- -D warnings
      - if: matrix.app == 'devkit'
        run: cargo xtask build --release --chip ${{ matrix.chip }} && cargo xtask verify

  chip-s3:
    name: Firmware (esp32s3, Xtensa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 1.98.1.0: 1.99 fails to link esp-hal 1.2.2 ("dangerous relocation: l32r").
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          default: false
          buildtargets: esp32s3
          ldproxy: false
          version: "1.98.1.0"
      - uses: Swatinem/rust-cache@v2
        with:
          key: esp32s3
      - run: cargo xtask keygen
      - run: cargo +esp clippy -p devkit --no-default-features --features esp32s3 --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
      - run: cargo +esp clippy -p iotkit-app --features iotkit-app/esp32s3,iotkit-app/deep-sleep --target xtensa-esp32s3-none-elf -Zbuild-std=core,alloc -- -D warnings
      - run: cargo xtask build --release --chip esp32s3 && cargo xtask verify
      # `cargo iotkit new` for the S3 (its project uses the esp toolchain).
      - run: cargo install --locked --path xtask
      - run: cargo iotkit new "$RUNNER_TEMP/new-s3" --answers xtask/answers/s3.toml --iotkit-path "$GITHUB_WORKSPACE"
      - run: cargo clippy --release -- -D warnings && cargo iotkit build --release && cargo iotkit verify
        working-directory: ${{ runner.temp }}/new-s3

  template:
    name: Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./template/check-sync.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-generate
      - uses: taiki-e/install-action@v2
        with:
          tool: espflash
      # The generated project depends on this checkout's crates, and gets `cargo iotkit`.
      - run: cargo install --locked --path xtask
      - run: cargo generate --path template --name ci-device --destination "$RUNNER_TEMP" --silent --define chip=esp32c6 --define "iotkit_path=$GITHUB_WORKSPACE"
      - run: cargo iotkit keygen && cargo iotkit build --release && cargo iotkit verify
        working-directory: ${{ runner.temp }}/ci-device
      # The RISC-V chips too (the S3 template needs the esp toolchain: see the chip-s3 job).
      - run: |
          for chip in esp32c3 esp32c5; do
            cargo generate --path template --name "ci-$chip" --destination "$RUNNER_TEMP" --silent --define chip=$chip --define "iotkit_path=$GITHUB_WORKSPACE"
            (cd "$RUNNER_TEMP/ci-$chip" && cargo iotkit keygen && cargo iotkit build --release && cargo iotkit verify)
          done
      # `cargo iotkit new` from answers files: every part kind with Matter on the C6, a battery C3.
      - run: |
          for c in c6 c3; do
            cargo iotkit new "$RUNNER_TEMP/new-$c" --answers xtask/answers/$c.toml --iotkit-path "$GITHUB_WORKSPACE"
            (cd "$RUNNER_TEMP/new-$c" && cargo clippy --release -- -D warnings && cargo iotkit build --release && cargo iotkit verify)
          done

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
