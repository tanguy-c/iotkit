name: Guide

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: mdbook build docs
      # Links between pages and their anchors; the web is not checked (flaky).
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress docs/book
          fail: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  # Settings > Pages > Source: GitHub Actions.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
