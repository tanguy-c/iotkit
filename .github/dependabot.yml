version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  # Firmware workspace and the host CLI are separate cargo projects.
  - package-ecosystem: cargo
    directories: [/, /xtask]
    schedule:
      interval: weekly
    labels: [dependencies]
    # The embedded stack (esp-hal, embassy, smoltcp, ...) moves together, by hand: this only
    # keeps security updates, which ignore the limit.
    open-pull-requests-limit: 0
