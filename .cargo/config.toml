# Wi-Fi credentials for the firmware: `secrets.toml` (git-ignored, see `secrets.toml.example`).
include = [{ path = "secrets.toml", optional = true }]

# Run cargo from the repository root: the runner's partition table path is relative to it.
# `--erase-parts otadata` makes every USB flash boot `ota_0`, even after an OTA switched slots.
[target.riscv32imac-unknown-none-elf] # ESP32-C6, ESP32-H2
runner    = "espflash flash --monitor --chip esp32c6 --flash-size 8mb --partition-table partitions.csv --erase-parts otadata"
# Backtraces (esp-backtrace) need frame pointers.
rustflags = ["-C", "force-frame-pointers"]

# The ESP32-C3 (no atomic instructions). Flash with `cargo iotkit flash`: chip and flash size
# come from the app.
[target.riscv32imc-unknown-none-elf]
rustflags = ["-C", "force-frame-pointers"]

# The ESP32-S3 (Xtensa): the `esp` toolchain (`espup install`) and `-Zbuild-std=core,alloc`,
# which `cargo iotkit` passes.
[target.xtensa-esp32s3-none-elf]
rustflags = ["-C", "link-arg=-nostartfiles", "-C", "link-arg=-Wl,--no-warn-rwx-segments"]

[build]
target = "riscv32imac-unknown-none-elf"

[alias]
# Host tooling: build, sign, flash, OTA (see xtask/).
xtask = "run --quiet --manifest-path xtask/Cargo.toml --target host-tuple --bin cargo-iotkit --"
# Host unit tests of the hardware-independent crates.
test-host = "test -p iotkit-core -p iotkit --target host-tuple --no-default-features --features iotkit-core/sign,iotkit/smartled"

[env]
# C code of Matter over Thread (OpenThread, mbedtls) is built with the host's clang.
CC_riscv32imac_unknown_none_elf = "clang"
AR_riscv32imac_unknown_none_elf = "ar"
# Log level, read at build time by esp-println.
ESP_LOG = "info,rs_matter_stack=warn"
