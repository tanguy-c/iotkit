label  = "Smoke alarm"
group  = "detects"
order  = 40
name   = "Smoke"
wiring = "the alarm's interconnect / relay output"
matter = "Smoke alarm"

[entity]
type    = "BinarySensor"
builder = ".device_class(DeviceClass::SMOKE)"

[[pins]]
use = "input"

[todo]
text  = "read the alarm's output"
buses = ["gpio-in"]

# `components::binary_input`, debounced.
[code]
uses  = [
    "embassy_time::Duration",
    "esp_hal::gpio::Input",
    "esp_hal::gpio::InputConfig",
    "iotkit::Active",
    "iotkit::components",
]
param = "pin: Input<'static>"
arg   = "Input::new(pin, InputConfig::default())"
body  = "components::binary_input(&{{ entity }}, pin, Active::High, Duration::from_millis(50)).await"

# On battery: its level once per wake-up.
read      = "{{ entity }}.set(Input::new(pin, InputConfig::default()).is_high());"
read_uses = ["esp_hal::gpio::Input", "esp_hal::gpio::InputConfig"]
