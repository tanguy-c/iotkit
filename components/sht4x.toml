label   = "Temperature + humidity: SHT40/41/45 (I²C)"
group   = "measures"
order   = 10
name    = "Air"
wiring  = "SDA and SCL to the bus, VCC to 3.3 V, GND; its address by part number: 0x44 (-AD1B, most), 0x45 (-BD1B), 0x46 (-CD1B)"
sources = [
    "https://github.com/esphome/esphome/blob/dev/esphome/components/sht4x/sensor.py",
    "https://github.com/zephyrproject-rtos/zephyr/blob/main/dts/bindings/sensor/sensirion,sht4x.yaml",
]

[[entities]]
key    = "temperature"
name   = "temperature"
ctor   = "temperature"
matter = "Temperature sensor"
value  = "r.temperature"

[[entities]]
key    = "humidity"
name   = "humidity"
ctor   = "humidity"
matter = "Humidity sensor"
value  = "r.humidity"

[i2c]
addresses = [0x44, 0x45, 0x46]
read      = "components::i2c::sht4x({{ i2c }}, ADDR).await"

[todo]
text    = "read °C and % RH"
buses   = ["i2c"]
drivers = "`components::i2c::sht4x(&mut i2c, 0x44)`"
