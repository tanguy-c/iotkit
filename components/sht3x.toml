label   = "Temperature + humidity: SHT30/31/35 (I²C)"
group   = "measures"
order   = 11
name    = "Air"
wiring  = "SDA and SCL to the bus, VIN to 3.3 V, GND; ADDR to GND (0x44) or 3.3 V (0x45)"
sources = [
    "https://github.com/esphome/esphome/blob/dev/esphome/components/sht3xd/sensor.py",
    "https://github.com/zephyrproject-rtos/zephyr/blob/main/dts/bindings/sensor/sensirion,sht3xd.yaml",
]

[[entities]]
key    = "temperature"
name   = "temperature"
ctor   = "temperature"
matter = "Temperature sensor"
value  = "r.temperature"

[[entities]]
key    = "humidity"
name   = "humidity"
ctor   = "humidity"
matter = "Humidity sensor"
value  = "r.humidity"

[i2c]
addresses = [0x44, 0x45]
read      = "components::i2c::sht3x({{ i2c }}, ADDR).await"

[todo]
text    = "read °C and % RH"
buses   = ["i2c"]
drivers = "`components::i2c::sht3x(&mut i2c, 0x44)`"
