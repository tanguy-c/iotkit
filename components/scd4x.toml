label   = "CO2 + temperature + humidity: SCD40/41 (I²C)"
group   = "measures"
order   = 49
name    = "Air"
wiring  = "SDA and SCL to the bus, VDD to 3.3 V, GND (address 0x62); it measures every 30 s, drawing about 3 mA"
sources = [
    "https://github.com/esphome/esphome/blob/dev/esphome/components/scd4x/sensor.py",
    "https://github.com/zephyrproject-rtos/zephyr/blob/main/dts/bindings/sensor/sensirion,scd41.yaml",
]

[[entities]]
key    = "co2"
name   = "CO2"
ctor   = "carbon_dioxide"
matter = "Air quality sensor"
value  = "r.co2"

[[entities]]
key    = "temperature"
name   = "temperature"
ctor   = "temperature"
matter = "Temperature sensor"
value  = "r.temperature"

[[entities]]
key    = "humidity"
name   = "humidity"
ctor   = "humidity"
matter = "Humidity sensor"
value  = "r.humidity"

[i2c]
addresses = [0x62]
read      = "components::i2c::scd4x({{ i2c }}, ADDR).await"

[todo]
text    = "read ppm, °C and % RH"
buses   = ["i2c"]
drivers = "`components::i2c::scd4x(&mut i2c, 0x62)`"
