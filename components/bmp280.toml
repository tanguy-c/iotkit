label   = "Temperature + pressure: BMP280 (I²C)"
group   = "measures"
order   = 29
name    = "Air"
wiring  = "SDA and SCL to the bus, VIN to 3.3 V, GND; SDO to GND (0x76, most modules) or 3.3 V (0x77)"
sources = [
    "https://github.com/esphome/esphome/blob/dev/esphome/components/bmp280_i2c/sensor.py",
    "https://github.com/zephyrproject-rtos/zephyr/blob/main/dts/bindings/sensor/bosch,bme280-i2c.yaml",
]

[[entities]]
key    = "temperature"
name   = "temperature"
ctor   = "temperature"
matter = "Temperature sensor"
value  = "r.temperature"

[[entities]]
key    = "pressure"
name   = "pressure"
ctor   = "pressure"
matter = "Pressure sensor"
value  = "r.pressure"

[i2c]
addresses = [0x76, 0x77]
read      = "components::i2c::bmp280({{ i2c }}, ADDR).await"

[todo]
text    = "read °C and hPa"
buses   = ["i2c"]
drivers = "`components::i2c::bmp280(&mut i2c, 0x76)`"
