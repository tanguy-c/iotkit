# Firmware workspace. `xtask/` (host tooling) and `template/` are separate projects.
[workspace]
resolver = "3"
members  = ["crates/*", "apps/*"]
exclude  = ["xtask", "template"]
# Plain `cargo build/run` builds the reference firmware.
default-members = ["apps/devkit"]
# `thread-light` (Matter over Thread) needs clang and cmake: `cargo build -p thread-light`.

[workspace.package]
edition      = "2024"
rust-version = "1.95"
version      = "0.5.1"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/tanguy-c/iotkit"
# Not on crates.io (yet): projects use the git repository.
publish      = false

[workspace.dependencies]
iotkit-core   = { path = "crates/iotkit-core" }
iotkit-image  = { path = "crates/iotkit-image" }
iotkit        = { path = "crates/iotkit" }
iotkit-build  = { path = "crates/iotkit-build" }

# No chip feature here: each app picks its chip (`esp32c6` by default) and forwards it.
esp-hal                = { version = "~1.2.2", features = ["log-04", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["log-04"] }
esp-println            = { version = "0.18.0", features = ["log-04"] }
esp-hal-smartled       = { version = "0.18" }
esp-alloc              = { version = "0.11.0" }
embassy-executor       = { version = "0.10.0", features = ["log"] }
embassy-time           = { version = "0.5.1", features = ["log"] }
smart-leds             = "0.4"
embassy-sync           = "0.8"
embedded-io-async      = "0.7"
heapless               = "0.9"
static_cell            = "2.1"
# Release builds keep info logs and up: debug and trace (and the formatting tables they pull in,
# which esp-hal keeps in RAM) are compiled out. Debug builds keep every level.
log                    = { version = "0.4.27", features = ["release_max_level_info"] }

[profile.dev]
# The default debug profile is too slow and too big for the chip.
opt-level = "s"

# Ed25519 verification unrolls into about 1.2 MB at `s`; at `z` it is a fraction of that. Also
# for `iotkit-image` (kept apart for this), as LTO inlines the verification into it.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev.package.ed25519-compact]
opt-level = "z"

[profile.release.package.iotkit-image]
opt-level = "z"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
