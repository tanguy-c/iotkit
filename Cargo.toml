# Firmware workspace. `xtask/` (host tooling) and `template/` are separate projects.
[workspace]
resolver = "3"
members  = ["crates/*", "apps/*"]
exclude  = ["xtask", "template"]
# Plain `cargo build/run` builds the reference firmware.
default-members = ["apps/devkit"]
# `thread-light` (Matter over Thread) needs clang and cmake: `cargo build -p thread-light`.

[workspace.package]
edition      = "2024"
rust-version = "1.95"
version      = "0.1.0"
license      = "Apache-2.0"

[workspace.dependencies]
iotkit-image  = { path = "crates/iotkit-image" }
iotkit-config = { path = "crates/iotkit-config" }
iotkit-diag   = { path = "crates/iotkit-diag" }
iotkit-runtime = { path = "crates/iotkit-runtime" }
iotkit-net    = { path = "crates/iotkit-net" }
iotkit-ota    = { path = "crates/iotkit-ota" }
iotkit-provision = { path = "crates/iotkit-provision" }
iotkit-model  = { path = "crates/iotkit-model" }
iotkit-link-mqtt = { path = "crates/iotkit-link-mqtt" }
iotkit-link-matter = { path = "crates/iotkit-link-matter" }

esp-hal                = { version = "~1.2.2", features = ["esp32c6", "log-04", "unstable"] }
esp-rtos               = { version = "0.4.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32c6", "log-04"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32c6", "log-04"] }
esp-println            = { version = "0.18.0", features = ["esp32c6", "log-04"] }
esp-hal-smartled       = { version = "0.18", features = ["esp32c6"] }
esp-alloc              = { version = "0.11.0", features = ["esp32c6"] }
embassy-executor       = { version = "0.10.0", features = ["log"] }
embassy-time           = { version = "0.5.1", features = ["log"] }
smart-leds             = "0.4"
embassy-sync           = "0.8"
embedded-io-async      = "0.7"
heapless               = "0.9"
static_cell            = "2.1"
log                    = "0.4.27"

[profile.dev]
# The default debug profile is too slow and too big for the chip.
opt-level = "s"

# Ed25519 verification unrolls into about 1.2 MB at `s`; at `z` it is a fraction of that.
[profile.release.package.ed25519-compact]
opt-level = "z"

[profile.dev.package.ed25519-compact]
opt-level = "z"

# Same reason: LTO inlines the Ed25519 verification into it.
[profile.release.package.iotkit-image]
opt-level = "z"

[profile.release]
codegen-units = 1
debug         = 2
lto           = 'fat'
opt-level     = 's'
