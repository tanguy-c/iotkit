[package]
name         = "iotkit-ota"
description  = "Signed firmware updates over HTTP into the spare OTA slot, with automatic rollback"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[features]
## Release checks (`request_check`) and download progress, for Home Assistant's update entity.
check = []
## Atomics for chips without compare-and-swap (ESP32-C3); turned on by the `esp32c3` feature.
portable-atomic = ["dep:portable-atomic", "iotkit-config/portable-atomic", "iotkit-diag/portable-atomic"]
## ESP32-C6 slots and download (`esp` module). Without it the boot policy is host-testable.
esp32c6 = ["_esp", "esp-hal/esp32c6", "esp-storage/esp32c6", "esp-bootloader-esp-idf/esp32c6", "iotkit-config/esp32c6", "iotkit-net/esp32c6", "iotkit-diag/esp32c6"]
esp32c3 = ["portable-atomic", "_esp", "esp-hal/esp32c3", "esp-storage/esp32c3", "esp-bootloader-esp-idf/esp32c3", "iotkit-config/esp32c3", "iotkit-net/esp32c3", "iotkit-diag/esp32c3"]
esp32c5 = ["_esp", "esp-hal/esp32c5", "esp-storage/esp32c5", "esp-bootloader-esp-idf/esp32c5", "iotkit-config/esp32c5", "iotkit-net/esp32c5", "iotkit-diag/esp32c5"]
esp32s3 = ["_esp", "esp-hal/esp32s3", "esp-storage/esp32s3", "esp-bootloader-esp-idf/esp32s3", "iotkit-config/esp32s3", "iotkit-net/esp32s3", "iotkit-diag/esp32s3"]
_esp = ["dep:esp-hal", "dep:esp-storage", "dep:esp-bootloader-esp-idf", "dep:embassy-net", "dep:embassy-time", "dep:embassy-executor", "dep:embassy-futures", "dep:embassy-sync", "dep:embedded-io-async"]

[dependencies]
portable-atomic  = { version = "1.11", optional = true, default-features = false }  # esp-hal sets its single-core mode
iotkit-config = { workspace = true }
iotkit-image  = { workspace = true }
iotkit-net    = { workspace = true }
iotkit-diag   = { workspace = true }
heapless      = { version = "0.9", features = ["serde"] }
log           = "0.4.27"
serde         = { version = "1", default-features = false, features = ["derive"] }

embassy-executor       = { version = "0.10.0", optional = true }
embassy-futures        = { version = "0.1", optional = true }
embassy-sync           = { version = "0.8", optional = true }
embassy-net            = { version = "0.9.1", optional = true }
embassy-time           = { version = "0.5.1", optional = true }
embedded-io-async      = { version = "0.7", optional = true }
esp-bootloader-esp-idf = { version = "0.6.0", optional = true }
esp-hal                = { version = "~1.2.2", optional = true, features = ["unstable"] }
esp-storage            = { version = "0.10", optional = true, features = ["embedded-storage"] }
