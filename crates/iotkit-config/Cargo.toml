[package]
name         = "iotkit-config"
description  = "Typed, versioned settings in the `config` flash partition, and the shared flash handle"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[features]
## Atomics for chips without compare-and-swap (ESP32-C3); turned on by the `esp32c3` feature.
portable-atomic = ["dep:portable-atomic"]
## The ESP32-C6 flash and partition table (`esp` module). Without a chip feature the crate is
## host-testable over any async NOR flash.
esp32c6 = ["_esp", "esp-hal/esp32c6", "esp-storage/esp32c6", "esp-bootloader-esp-idf/esp32c6"]
esp32c3 = ["portable-atomic", "_esp", "esp-hal/esp32c3", "esp-storage/esp32c3", "esp-bootloader-esp-idf/esp32c3"]
esp32c5 = ["_esp", "esp-hal/esp32c5", "esp-storage/esp32c5", "esp-bootloader-esp-idf/esp32c5"]
esp32s3 = ["_esp", "esp-hal/esp32s3", "esp-storage/esp32s3", "esp-bootloader-esp-idf/esp32s3"]
esp32h2 = ["_esp", "esp-hal/esp32h2", "esp-storage/esp32h2", "esp-bootloader-esp-idf/esp32h2"]
_esp = ["dep:esp-hal", "dep:esp-storage", "dep:esp-bootloader-esp-idf", "dep:embassy-embedded-hal", "dep:embedded-storage", "dep:embassy-sync"]

[dependencies]
portable-atomic  = { version = "1.11", optional = true, default-features = false }  # esp-hal sets its single-core mode
embedded-storage-async = "0.4"
log                    = "0.4.27"
postcard               = { version = "1.1", default-features = false }
sequential-storage     = "3.0"
serde                  = { version = "1", default-features = false }

embassy-sync           = { version = "0.8", optional = true }
embassy-embedded-hal   = { version = "0.6", optional = true, default-features = false }
embedded-storage       = { version = "0.3", optional = true }
esp-bootloader-esp-idf = { version = "0.6.0", optional = true }
esp-hal                = { version = "~1.2.2", optional = true, features = ["unstable"] }
esp-storage            = { version = "0.10", optional = true, features = ["embedded-storage"] }

[dev-dependencies]
embassy-futures = "0.1"
serde           = { version = "1", default-features = false, features = ["derive"] }
