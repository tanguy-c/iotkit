[package]
name         = "iotkit-core"
description  = "The chip-independent half of iotkit: device model, typed settings, signed update images, health check"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[features]
## Atomics for chips without compare-and-swap (ESP32-C3); turned on by `iotkit`'s `esp32c3`.
portable-atomic = ["dep:portable-atomic"]
## Bindings beyond MQTT and Matter (`model::Binding::allocate`): for other transports.
extra-bindings = []
## Signing images and manifests (the CLI; never in firmware).
sign = ["iotkit-image/sign"]

[dependencies]
iotkit-image           = { workspace = true }
portable-atomic        = { version = "1.11", optional = true, default-features = false }  # esp-hal sets its single-core mode
critical-section       = "1.2"
embassy-sync           = "0.8"
embedded-storage-async = "0.4"
heapless               = "0.9"
log                    = "0.4.27"
postcard               = { version = "1.1", default-features = false }
sequential-storage     = "3.0"
serde                  = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-futures  = "0.1"
