[package]
name         = "iotkit-image"
description  = "Firmware manifest and signature format shared by the device (iotkit-ota) and the host tooling (xtask)"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[features]
## Signing, for the host tooling. The device only verifies.
sign = []

[dependencies]
ed25519-compact = { version = "2.6", default-features = false }
serde           = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.7"
sha2            = { version = "0.11", default-features = false }

[dev-dependencies]
ed25519-compact = { version = "2.6", default-features = false, features = ["random"] }
