[package]
name         = "iotkit-components"
description  = "Ready-made parts: async functions that drive an entity from embedded-hal hardware"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[features]
## WS2812 and other addressable LEDs as a light (`smart-leds`).
smartled = ["dep:smart-leds"]

[dependencies]
iotkit-model       = { workspace = true }
embassy-futures    = "0.1"
embassy-time       = { workspace = true }
embedded-hal       = "1.0"
embedded-hal-async = "1.0"
log                = { workspace = true }
smart-leds         = { workspace = true, optional = true }

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-sync     = { workspace = true }
embassy-time     = { workspace = true, features = ["mock-driver", "generic-queue-8"] }
