[package]
name         = "iotkit-app"
description  = "Starts every iotkit service in the right order: one call for a device's firmware"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true

[features]
## The chip (one is required).
esp32c6 = [
    "esp-hal/esp32c6", "esp-println/esp32c6",
    "iotkit-config/esp32c6", "iotkit-diag/esp32c6", "iotkit-net/esp32c6", "iotkit-ota/esp32c6",
    "iotkit-provision/esp32c6", "iotkit-link-mqtt/esp32c6",
    "iotkit-link-matter?/esp32c6",
]
esp32c3 = [
    "iotkit-model/portable-atomic", "iotkit-runtime/portable-atomic",
    "esp-hal/esp32c3", "esp-println/esp32c3",
    "iotkit-config/esp32c3", "iotkit-diag/esp32c3", "iotkit-net/esp32c3", "iotkit-ota/esp32c3",
    "iotkit-provision/esp32c3", "iotkit-link-mqtt/esp32c3",
    "iotkit-link-matter?/esp32c3",
]
esp32c5 = [
    "esp-hal/esp32c5", "esp-println/esp32c5",
    "iotkit-config/esp32c5", "iotkit-diag/esp32c5", "iotkit-net/esp32c5", "iotkit-ota/esp32c5",
    "iotkit-provision/esp32c5", "iotkit-link-mqtt/esp32c5",
    "iotkit-link-matter?/esp32c5",
]
esp32s3 = [
    "esp-hal/esp32s3", "esp-println/esp32s3",
    "iotkit-config/esp32s3", "iotkit-diag/esp32s3", "iotkit-net/esp32s3", "iotkit-ota/esp32s3",
    "iotkit-provision/esp32s3", "iotkit-link-mqtt/esp32s3",
    "iotkit-link-matter?/esp32s3",
]
## Updates from Home Assistant: a `firmware` update entity; the device checks the manifest URL
## set with `update-url` (or `OTA_MANIFEST_URL` at build time) and installs on request.
ha-update = ["iotkit-ota/check", "dep:embassy-futures"]
## Deep-sleeping devices over MQTT (`start_sleepy`): fast reconnect, retained commands, sleep.
deep-sleep = ["iotkit-net/fast-connect", "iotkit-link-mqtt/sleepy", "dep:embassy-futures", "dep:embassy-net"]
## Matter over Wi-Fi, next to MQTT (8 MB flash: about 2.1 MB of firmware).
matter-wifi = ["dep:iotkit-link-matter", "iotkit-link-matter/wifi", "iotkit-net/matter"]

[dependencies]
iotkit-config      = { workspace = true }
iotkit-diag        = { workspace = true, features = ["panic-handler"] }
iotkit-image       = { workspace = true }
iotkit-link-matter = { workspace = true, optional = true }
iotkit-link-mqtt   = { workspace = true }
iotkit-model       = { workspace = true }
iotkit-net         = { workspace = true }
iotkit-ota         = { workspace = true }
iotkit-provision   = { workspace = true }
iotkit-runtime     = { workspace = true }

embassy-executor  = { workspace = true }
embassy-futures   = { version = "0.1", optional = true }
embassy-net       = { version = "0.9.1", optional = true }
embassy-sync      = { workspace = true }
embassy-time      = { workspace = true }
embedded-io-async = { workspace = true }
esp-hal           = { workspace = true }
esp-println       = { workspace = true }
heapless          = { workspace = true }
log               = { workspace = true }
static_cell       = { workspace = true }
