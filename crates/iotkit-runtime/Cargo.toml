[package]
name         = "iotkit-runtime"
description  = "Boot flow and supervisor: the health check that decides a firmware is good"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[features]
## Atomics for chips without compare-and-swap (ESP32-C3); turned on by the `esp32c3` feature.
portable-atomic = ["dep:portable-atomic"]

[dependencies]
portable-atomic  = { version = "1.11", optional = true, default-features = false }  # esp-hal sets its single-core mode
embassy-sync = "0.8"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-futures  = "0.1"
