[package]
name         = "iotkit-model"
description  = "What a device is, once: entities with typed state and commands, independent of MQTT or Matter"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true

[features]
## Atomics for chips without compare-and-swap (ESP32-C3); turned on by the `esp32c3` feature.
portable-atomic = ["dep:portable-atomic"]

[dependencies]
portable-atomic  = { version = "1.11", optional = true, default-features = false }  # esp-hal sets its single-core mode
critical-section = "1.2"
embassy-sync     = "0.8"
heapless         = "0.9"

[dev-dependencies]
critical-section = { version = "1.2", features = ["std"] }
embassy-futures  = "0.1"
