[package]
name         = "iotkit-net"
description  = "Wi-Fi station with reconnect, DHCP, DNS, mDNS responder and a small HTTP client"
edition.workspace      = true
rust-version.workspace = true
version.workspace      = true
license.workspace      = true

[features]
## ESP32-C6 Wi-Fi (`esp` module). Without a chip feature the protocol logic is host-testable.
esp32c6 = ["_esp", "esp-hal/esp32c6", "esp-radio/esp32c6", "iotkit-config/esp32c6"]
esp32c3 = ["_esp", "esp-hal/esp32c3", "esp-radio/esp32c3", "iotkit-config/esp32c3"]
esp32c5 = ["_esp", "esp-hal/esp32c5", "esp-radio/esp32c5", "iotkit-config/esp32c5"]
esp32s3 = ["_esp", "esp-hal/esp32s3", "esp-radio/esp32s3", "iotkit-config/esp32s3"]
## For Matter (`iotkit-link-matter`): IPv6 link-local address, room for its sockets, and its own
## mDNS responder instead of ours (it also answers `<hostname>.local`).
matter = ["embassy-net?/proto-ipv6"]
_esp = ["dep:esp-hal", "dep:esp-radio", "dep:embassy-net", "dep:embassy-executor", "dep:embassy-time", "dep:embassy-futures", "dep:embassy-sync", "dep:embedded-io-async", "dep:static_cell", "dep:smoltcp"]

[dependencies]
iotkit-config = { workspace = true }
heapless      = { version = "0.9", features = ["serde"] }
log           = "0.4.27"
serde         = { version = "1", default-features = false, features = ["derive"] }

embassy-executor  = { version = "0.10.0", optional = true }
embassy-futures   = { version = "0.1", optional = true }
embassy-sync      = { version = "0.8", optional = true }
embassy-net       = { version = "0.9.1", optional = true, features = ["dhcpv4", "dhcpv4-hostname", "dns", "log", "medium-ethernet", "multicast", "proto-ipv4", "tcp", "udp"] }
embassy-time      = { version = "0.5.1", optional = true }
embedded-io-async = { version = "0.7", optional = true }
esp-hal           = { version = "~1.2.2", optional = true, features = ["unstable"] }
esp-radio         = { version = "1.0.0-beta.1", optional = true, features = ["esp-alloc", "log-04", "unstable", "wifi"] }
static_cell       = { version = "2.1", optional = true }
# Only to answer pings (embassy-net leaves it off).
smoltcp           = { version = "0.13", optional = true, default-features = false, features = ["auto-icmp-echo-reply"] }
